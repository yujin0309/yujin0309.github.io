<script>
			function showTip(msg) {
				var tip = document.getElementById('player-tip');
				if (!tip) return;
				tip.textContent = msg;
				tip.style.display = msg ? 'block' : 'none';
			}

			function play() {
				var src = $('#player-src').val().trim();
				showTip('');
				if (!src) return false;

				if (typeof extractKickChannel === 'function' && typeof playKick === 'function') {
					var kickChannel = extractKickChannel(src);
					if (kickChannel) {
						playKick(kickChannel);
						return false;
					}
				}

				if (typeof playM3U8 === 'function') {
					playM3U8(src);
				} else if (window.Hls && Hls.isSupported()) {
					var video = document.getElementById('player');
					var hls = new Hls();
					hls.loadSource(src);
					hls.attachMedia(video);
					hls.on(Hls.Events.ERROR, function (_, data) {
						if (data && data.fatal) {
							var code = data.response && data.response.code ? ' (HTTP ' + data.response.code + ')' : '';
							showTip('스트림 재생 실패' + code + ': 서버 접근 제한(CORS/403) 또는 지원되지 않는 스트림일 수 있습니다.');
						}
					});
				}
				return false;
			}

			$(document).ready(function () {
				$('#player-form').submit(play);
			});

			window.addEventListener('resize', function () {
				var uriInputForm = document.getElementById('player-form');
				if (uriInputForm && window.innerWidth > 768 && uriInputForm.style.display === 'none') {
					uriInputForm.style.display = 'block';
				}
			});
		</script>
